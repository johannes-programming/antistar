[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=77.0",
]

[project]
name = "antistar"
version = "1.2.0.post0"
description = "This project provides a function that returns its positional arguments as a tuple."
readme = "README.rst"
keywords = []
license = "MIT"
license-files = [
    "LICENSE.txt",
]
authors = [
    { name = "Johannes", email = "johannes.programming@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = []
urls.Download = "https://pypi.org/project/antistar/#files"
urls.Index = "https://pypi.org/project/antistar/"
urls.Source = "https://github.com/johannes-programming/antistar/"
urls.Website = "https://antistar.johannes-programming.online/"

[tool.ruff]
line-length = 79
lint.select = [
    "I",
]

[tool.pyproject-fmt]
indent = 4
keep_full_version = true
max_supported_python = "3.15"

[tool.mypy]
files = [
    ".",
]
python_version = "3.11"
strict = true
